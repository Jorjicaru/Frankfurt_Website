<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/Frankfurt_logo.png">
</head>
<body>
    <header class="site-header">
        <div class="site-title">Frankfurt am Main</div>
        <div class="site-logo">
            <img src="images/Frankfurt_logo.png" alt="logo_Frankfurt">
        </div>
    </header>

    <nav class="main-nav">
        <div class="mobile-page-title">Contact</div>

        <ul id="myLinks" class="menu-list">
            <li><a href="index.html">Pagina principală</a></li>
            <li><a href="obiective_turistice.html">Obiective turistice</a></li>
            <li><a href="cazare.html">Cazare</a></li>
            <li><a href="evenimente.html">Evenimente</a></li>
            <li><a class="active" href="contact.html">Contact</a></li>
        </ul>

        <a href="javascript:void(0);" class="icon" onclick="myFunction()">
            &#9776;
        </a>
    </nav>

    <div class="contact-container">
        <h2>Contactează-ne</h2>
        <p style="text-align:center; color:#666; margin-bottom: 20px;">Ai o întrebare? Scrie-ne un mesaj!</p>
        
        <form id="contactForm" action="contact_sent.html">
            
            <div class="form-item">
                <label for="name">Nume si prenume:</label>
                <input type="text" id="name" placeholder="Introdu numele tau...">
            </div>

            <div class="form-item">
                <label for="phone">Numar de telefon:</label>
                <input type="tel" id="phone" placeholder="07xx xxx xxx">
            </div>

            <div class="form-item">
                <label for="email">E-Mail:</label>
                <input type="email" id="email" placeholder="exemplu@email.com">
            </div>

            <div class="form-item">
                <label for="message">Mesaj:</label>
                <textarea id="message" rows="5" placeholder="Scrie mesajul tău aici..."></textarea>
            </div>

            <button type="submit" class="buton-contact">Trimite Mesajul</button>
        </form>
    </div>
    <footer class="site-footer">
        <div class="footer-content">
            <p>&copy; 2024 Frankfurt Tourism. Toate drepturile rezervate.</p>
            <div class="social-links">
                <a href="#">Facebook</a>
                <a href="#">Instagram</a>
            </div>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
